# Minecraft AntiServerClose by iAlturki
# Copy these values into config/minecraft-antiserverclose/antiserverclose.properties.
# Replace the examples before enabling. Never put a password or token here.
enabled=false
username=ExamplePlayer
address=server.example.com:25565
# true means you consent to reusable account credentials stored on this host.
authentication-approved=false
# Accepted range: 60–600 seconds. Invalid values fall back to 90.
reconnect-seconds=90
